name: First Scraper

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
       - name: Checkout
         uses: actions/checkout@v6
       - name: Install Python
         uses: actions/setup-python@v6
         with:
            python-version: '3.12'
       - name: Install scraper
         run: pip install warn-scraper
       - name: Scrape
         run: warn-scraper pa --data-dir ./data/
       - name: Commit and push
         run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ./data/
          git commit -m "Latest data for Pennsylvania" && git push || true
